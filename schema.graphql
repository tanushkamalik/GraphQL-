type Query {
  test: String

  students: [Student]
  student(id: ID!): Student

  colleges: [College]
  college(id: ID!): College
}

type Student {
  id: ID!
  name: String
  age: Int
  major: String
  collegeId: ID
  college: College
}

type College {
  id: ID!
  name: String
  location: String
  students: [Student]
}
